services:
  - type: web
    name: rays-dynamics-middleware
    runtime: node
    plan: starter          # free tier sleeps after inactivity — bad for WebSocket testing, use starter ($7/mo) for reliable WS testing. Change to "free" if you just want to try it cheaply first.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rays-dynamics-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEVICE_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: CORS_ORIGIN
        value: "*"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "RAYS DYNAMICS <onboarding@resend.dev>"

databases:
  - name: rays-dynamics-db
    plan: free              # Render free Postgres expires after 90 days — fine for testing, upgrade before real launch
